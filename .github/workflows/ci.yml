name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 验证与构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: 缓存 Bun 下载
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 生成 Prisma Client
        run: bunx prisma generate

      - name: 运行 ESLint
        run: bun run lint

      - name: 运行 TypeScript 检查
        run: bun run typecheck
        env:
          MOCK_AI: 'true'
          DATABASE_URL: 'mysql://ci:ci@localhost:3306/ci'

      - name: 运行测试
        run: bun run test
        env:
          MOCK_AI: 'true'

      - name: 构建
        run: bun run build
        env:
          MOCK_AI: 'true'
          DATABASE_URL: 'mysql://ci:ci@localhost:3306/ci'

  deploy:
    name: 部署到阿里云 ECS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: quality

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

      - name: 部署到服务器
        run: |
          ssh ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} << 'ENDSSH'
            set -euo pipefail
            cd /opt/marketing
            git pull --ff-only origin master
            npm ci
            npm exec -- prisma generate
            NODE_OPTIONS=--max-old-space-size=4096 npm run build
            pm2 restart genilink-content
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error http://127.0.0.1:4002/ >/dev/null && exit 0
              sleep 5
            done
            exit 1
          ENDSSH

      - name: 通知部署结果
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "部署成功 ✅"
          else
            echo "部署失败 ❌"
            exit 1
          fi
